<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameRev · Lab iOS Ago-Dic 2026 · Equipo 6 (SwiftUI + Web)</title>
  <style>
    :root {
      --bg-deep: #0b1323;
      --bg-panel: #111b30;
      --bg-card: #17243f;
      --border-subtle: rgba(148, 163, 184, 0.16);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --ios-bg: #f2f4f8;
      --ios-card: #ffffff;
      --ios-text: #0f172a;
      --ios-muted: #64748b;
      --accent-blue: #2563eb;
      --accent-gold: #f59e0b;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-purple: #8b5cf6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg-deep);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
    }

    /* Sidebar de Escenas del Lab iOS */
    .lab-sidebar {
      width: 255px;
      background: #080f1d;
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: 100vh;
      position: sticky;
      top: 0;
    }

    .brand-header {
      padding: 20px 18px 14px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand-header h1 {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .brand-badge {
      background: #172554;
      color: var(--accent-gold);
      font-size: 12px;
      font-weight: 900;
      padding: 5px 8px;
      border-radius: 8px;
      border: 1px solid rgba(245, 158, 11, 0.35);
    }

    .brand-sub {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .scene-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .scene-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 11px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .scene-btn:hover {
      background: rgba(37, 99, 235, 0.12);
      color: var(--text-main);
    }

    .scene-btn.active {
      background: var(--accent-blue);
      color: #ffffff;
      font-weight: 600;
    }

    .scene-num {
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      opacity: 0.75;
      min-width: 20px;
    }

    .sidebar-footer {
      padding: 14px 16px;
      border-top: 1px solid var(--border-subtle);
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.45;
    }

    /* Contenedor Principal */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      padding: 14px 26px;
      background: rgba(17, 27, 48, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .scene-header-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .scene-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1.5px solid #38bdf8;
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
    }

    .scene-meta h2 {
      font-size: 18px;
      font-weight: 700;
    }

    .scene-meta p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .device-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill-toggle {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .pill-toggle.active {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      color: #fff;
    }

    .pill-toggle.warn {
      border-color: rgba(239, 68, 68, 0.45);
      color: #fca5a5;
    }

    .pill-toggle.warn.active {
      background: var(--accent-red);
      color: #fff;
    }

    .stage {
      flex: 1;
      padding: 28px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 32px;
      flex-wrap: wrap;
    }

    /* Marco de iPhone */
    .iphone-frame {
      width: 375px;
      height: 750px;
      background: var(--ios-bg);
      color: var(--ios-text);
      border-radius: 46px;
      border: 10px solid #263248;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
    }

    .status-bar {
      height: 40px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .dynamic-island {
      width: 92px;
      height: 22px;
      background: #090d16;
      border-radius: 999px;
    }

    .ios-navbar {
      padding: 8px 18px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(15, 23, 42, 0.06);
      background: rgba(242, 244, 248, 0.9);
      backdrop-filter: blur(8px);
      flex-shrink: 0;
    }

    .ios-nav-btn {
      border: none;
      background: none;
      color: var(--accent-blue);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .ios-nav-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--ios-text);
    }

    .ios-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .ios-tabbar {
      height: 62px;
      background: #ffffff;
      border-top: 1px solid rgba(15, 23, 42, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 4px 8px 8px;
      flex-shrink: 0;
    }

    .tab-btn {
      border: none;
      background: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active {
      color: var(--accent-blue);
    }

    .tab-icon {
      font-size: 17px;
    }

    /* Marco de MacBook Adaptativo (Escena 2 y 4) */
    .macbook-frame {
      width: 880px;
      min-height: 540px;
      background: #0f172a;
      color: #f8fafc;
      border-radius: 22px;
      border: 8px solid #334155;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.6);
      display: flex;
      overflow: hidden;
    }

    .mac-sidebar {
      width: 210px;
      background: #0b1324;
      border-right: 1px solid rgba(148, 163, 184, 0.14);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .mac-nav-item {
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: #94a3b8;
      text-align: left;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .mac-nav-item.active {
      background: rgba(37, 99, 235, 0.22);
      color: #60a5fa;
    }

    .mac-content {
      flex: 1;
      padding: 26px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Tarjetas y Componentes iOS */
    .cover-box {
      background: linear-gradient(135deg, #1e3a5f, #0f172a);
      color: #ffffff;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      flex-shrink: 0;
    }

    .hero-cover {
      width: 100%;
      height: 155px;
      border-radius: 20px;
      font-size: 40px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
      cursor: pointer;
    }

    .game-row {
      background: #ffffff;
      border-radius: 14px;
      padding: 11px 13px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
      cursor: pointer;
      transition: transform 0.12s;
    }

    .game-row:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      width: 100%;
      background: var(--accent-blue);
      color: #ffffff;
      border: none;
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary {
      width: 100%;
      background: rgba(37, 99, 235, 0.09);
      color: var(--accent-blue);
      border: none;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .ios-input, .ios-textarea, .ios-select {
      width: 100%;
      padding: 11px 13px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      background: #ffffff;
      color: var(--ios-text);
      font-size: 14px;
    }

    .ios-input.error {
      border-color: var(--accent-red);
      background: #fef2f2;
    }

    .chip-row {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .chip {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      border: none;
      background: #e2e8f0;
      color: #334155;
      white-space: nowrap;
      cursor: pointer;
    }

    .chip.active {
      background: var(--accent-blue);
      color: #ffffff;
    }

    /* Panel Explicativo de Arquitectura y Flujo (Derecha) */
    .flow-inspector {
      width: 390px;
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .tag-pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.6px;
    }

    .tag-purple {
      background: rgba(139, 92, 246, 0.18);
      color: #c4b5fd;
      border: 1px solid rgba(139, 92, 246, 0.4);
    }

    .tag-green {
      background: rgba(16, 185, 129, 0.16);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .tag-red {
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .decision-diamond {
      background: rgba(139, 92, 246, 0.12);
      border: 1.5px solid rgba(139, 92, 246, 0.45);
      border-radius: 16px;
      padding: 14px;
      text-align: center;
    }

    .code-snippet {
      background: #080f1d;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11.5px;
      color: #93c5fd;
      overflow-x: auto;
      line-height: 1.45;
    }
  </style>
</head>

    function loadState() {
      try {

        if (saved) {
          return { ... JSON.parse(JSON.stringify(DEFAULT_STATE)), ...JSON.parse(saved) };
        }
      } catch (e) {}
      return JSON.parse(JSON.stringify(DEFAULT_STATE));
    }

    function saveState() {
      try {
        localStorage.setItem("gamerev_lab_state_v1", JSON.stringify(state));
      } catch (e) {}
    }

    function resetDemoState() {
      localStorage.removeItem("gamerev_lab_state_v1");
      state = JSON.parse(JSON.stringify(DEFAULT_STATE));
      selectScene(state.currentScene);
    }

    // ============================================================================
    // NAVEGACIÓN ENTRE LAS 13 ESCENAS DEL STORYBOARD
    // ============================================================================
    function renderSidebar() {
      const list = document.getElementById("sceneList");
      list.innerHTML = SCENES.map(s => `
        <button class="scene-btn ${state.currentScene === s.id ? 'active' : ''}" onclick="selectScene(${s.id})">
          <span class="scene-num">${s.num}</span>
          <span>${s.short}</span>
        </button>
      `).join("");
    }

    function selectScene(sceneId) {
      state.currentScene = sceneId;
      state.authGateVisible = false;
      state.showCategoryModal = false;
      state.showNewReviewModal = false;
      state.showReviewDetail = false;
      state.isEditingOwnProfile = false;
      state.unauthorizedTriggered = false;

      switch (sceneId) {
        case 1:
          state.activeTab = "home";
          break;
        case 2:
          state.activeTab = "home";
          break;
        case 3:
          state.activeTab = "catalog";
          break;
        case 4:
          state.activeTab = "catalog";
          state.selectedGameId = "hk";
          break;
        case 5:
          state.currentUser = null;
          state.isReaderMode = true;
          state.pendingAction = "Guardar Hollow Knight";
          state.authGateVisible = true;
          break;
        case 6:
          ensureLoggedIn();
          state.activeTab = "diary";
          break;
        case 7:
          ensureLoggedIn();
          state.activeTab = "diary";
          state.showCategoryModal = true;
          state.creatingCategoryMode = true;
          state.newCategoryName = "Indies favoritos";
          state.categoryError = "Nombre duplicado";
          break;
        case 8:
          state.activeTab = "reviews";
          break;
        case 9:
          state.activeTab = "profile";
          state.viewingPublicProfileId = "tc";
          break;
        case 10:
          ensureLoggedIn();
          state.activeTab = "profile";
          state.viewingPublicProfileId = null;
          state.isEditingOwnProfile = true;
          state.currentUser.profileType = "Creador";
          break;
        case 11:
          state.activeTab = "profile";
          state.viewingPublicProfileId = "mr";
          state.unauthorizedTriggered = true;
          break;
        case 12:
        case 13:
          break;
      }

      saveState();
      renderAll();
    }

    function ensureLoggedIn() {
      if (!state.currentUser) {
        state.currentUser = JSON.parse(JSON.stringify(DEFAULT_STATE.currentUser));
        state.isReaderMode = false;
      }
    }

    function setDeviceMode(mode) {
      state.deviceMode = mode;
      document.getElementById("btnDeviceIphone").classList.toggle("active", mode === "iphone");
      document.getElementById("btnDeviceMac").classList.toggle("active", mode === "mac");
      renderAll();
    }

    function toggleNetworkError() {
      state.simulateNetworkError = !state.simulateNetworkError;
      if (state.simulateNetworkError) {
        state.currentScene = 3;
        state.activeTab = "catalog";
      }
      document.getElementById("btnSimNetError").classList.toggle("active", state.simulateNetworkError);
      renderAll();
    }

    // ============================================================================
    // RENDERIZADO GENERAL
    // ============================================================================
    function renderAll() {
      renderSidebar();
      const sceneMeta = SCENES.find(s => s.id === state.currentScene) || SCENES[0];
      document.getElementById("sceneNumberBadge").textContent = sceneMeta.num;
      document.getElementById("sceneTitle").textContent = sceneMeta.title;
      document.getElementById("sceneSubtitle").textContent = sceneMeta.sub;
      document.getElementById("btnSimNetError").classList.toggle("active", state.simulateNetworkError);

      const stage = document.getElementById("stageContainer");

      if (state.currentScene === 12) {
        stage.innerHTML = renderScene12ErrorsOverview();
        return;
      }
      if (state.currentScene === 13) {
        stage.innerHTML = renderScene13ArchitectureMap();
        return;
      }

      if (state.deviceMode === "mac") {
        stage.innerHTML = renderMacBookFrame() + renderFlowInspectorPanel();
      } else {
        stage.innerHTML = renderIphoneFrame() + renderFlowInspectorPanel();
      }
    }

    // PANTALLAS DENTRO DEL IPHONE
    // ============================================================================

      let navTitle = "GameRev";

        navTitle = state.creatingCategoryMode ? "Nueva categoría" : "Categorías";

        navTitle = "Nueva reseña";
        bodyHTML = renderNewReviewModalContent();

        bodyHTML = renderReviewDetailContent();

            break;
          case "reviews":

              <span class="tab-icon">⌂</span><span>Inicio</span>

            <button class="tab-btn ${state.activeTab === 'catalog' ? 'active' : ''}" onclick="switchTab('catalog')">
              <span class="tab-icon">⌕</span><span>Catálogo</span>

              <span class="tab-icon">▤</span><span>Diario</span>
            </button>

              <span class="tab-icon">💬</span><span>Reseñas</span>

    // ============================================================================
    // ACCIONES DE USUARIO Y VALIDACIONES
    // ============================================================================
    function getGame(id) {
      return state.games.find(g => g.id === id) || state.games[0];
    }

    function switchTab(tab) {
      state.activeTab = tab;
      state.authGateVisible = false;
      state.showCategoryModal = false;
      state.showNewReviewModal = false;
      state.showReviewDetail = false;
      state.isEditingOwnProfile = false;
      if (tab === "profile") state.viewingPublicProfileId = null;
      if (state.currentScene === 4 || state.currentScene === 12 || state.currentScene === 13) {
        state.currentScene = 2;
      }
      renderAll();
    }

    function goBackInPhone() {
      if (state.authGateVisible) { state.authGateVisible = false; }
      else if (state.showCategoryModal) { state.showCategoryModal = false; }
      else if (state.showNewReviewModal) { state.showNewReviewModal = false; }
      else if (state.showReviewDetail) { state.showReviewDetail = false; }
      else if (state.isEditingOwnProfile) { state.isEditingOwnProfile = false; }
      else if (state.viewingPublicProfileId) { state.viewingPublicProfileId = null; }
      else if (state.currentScene === 4) { state.currentScene = 3; state.activeTab = "catalog"; }
      renderAll();
    }

    function openGameDetail(gameId) {
      state.selectedGameId = gameId;
      state.currentScene = 4;
      renderAll();
    }

    function openCreatorProfile(creatorId) {
      state.viewingPublicProfileId = creatorId;
      state.activeTab = "profile";
      state.currentScene = 9;
      renderAll();
    }

    function updateSearch(val) {
      state.searchQuery = val;
      renderAll();
    }

    function setGenreFilter(gen) {
      state.genreFilter = gen;
      renderAll();
    }

    function clearSearch() {
      state.searchQuery = "";
      state.genreFilter = "Todos";
      renderAll();
    }

    function triggerSaveToDiary(gameId) {
      const g = getGame(gameId);
      if (!state.currentUser) {
        state.pendingAction = `Guardar ${g.title}`;
        state.authGateVisible = true;
        state.currentScene = 5;
        renderAll();
        return;
      }
      if (!state.diaryEntries.some(e => e.gameId === g.id)) {
        state.diaryEntries.unshift({ id: "d-" + Date.now(), gameId: g.id, status: "Jugando", category: "Indies favoritos", note: "Añadido desde la ficha." });
      }
      state.activeTab = "diary";
      state.currentScene = 6;
      saveState();
      renderAll();
    }

    function triggerWriteReview(gameId) {
      state.selectedGameId = gameId;
      if (!state.currentUser) {
        const g = getGame(gameId);
        state.pendingAction = `Escribir reseña de ${g.title}`;
        state.authGateVisible = true;
        state.currentScene = 5;
        renderAll();
        return;
      }
      state.showNewReviewModal = true;
      state.currentScene = 8;
      renderAll();
    }

    function triggerProtectedDiary() {
      state.pendingAction = "Abrir mi diario personal";
      state.authGateVisible = true;
      renderAll();
    }

    function completeProtectedAuth() {
      state.currentUser = JSON.parse(JSON.stringify(DEFAULT_STATE.currentUser));
      state.isReaderMode = false;
      state.authGateVisible = false;
      const action = state.pendingAction;
      state.pendingAction = null;
      if (action && action.startsWith("Escribir reseña")) {
        state.showNewReviewModal = true;
        state.currentScene = 8;
      } else {
        state.activeTab = "diary";
        state.currentScene = 6;
      }
      saveState();
      renderAll();
    }

    function cancelProtectedAuth() {
      state.pendingAction = null;
      state.authGateVisible = false;
      state.isReaderMode = true;
      renderAll();
    }

    function enterReaderMode() {
      state.currentUser = null;
      state.isReaderMode = true;
      state.activeTab = "catalog";
      renderAll();
    }

    function loginAsMauro() {
      state.currentUser = JSON.parse(JSON.stringify(DEFAULT_STATE.currentUser));
      state.isReaderMode = false;
      saveState();
      renderAll();
    }

    function openWelcome() {
      state.currentUser = null;
      state.isReaderMode = false;
      state.currentScene = 1;
      renderAll();
    }

    function toggleSessionQuick() {
      if (state.currentUser) {
        state.currentUser = null;
        state.isReaderMode = false;
        state.currentScene = 1;
      } else {
        loginAsMauro();
      }
      renderAll();
    }

    function setDiaryStatus(st) {
      state.diaryStatusFilter = st;
      renderAll();
    }

    function setDiaryCat(cat) {
      state.diaryCategoryFilter = cat;
      renderAll();
    }

    function cycleEntryStatus(entryId) {
      const order = ["Pendiente", "Jugando", "Completado", "Abandonado", "Rejugando"];
      const entry = state.diaryEntries.find(e => e.id === entryId);
      if (entry) {
        const next = order[(order.indexOf(entry.status) + 1) % order.length];
        entry.status = next;
        state.diaryStatusFilter = "Todos";
        saveState();
        renderAll();
      }
    }

    function openCategoriesModal() {
      state.showCategoryModal = true;
      state.creatingCategoryMode = false;
      state.currentScene = 7;
      renderAll();
    }

    function updateCategoryInput(val) {
      state.newCategoryName = val;
      const dup = state.categories.some(c => c.name.toLowerCase() === val.trim().toLowerCase());
      state.categoryError = dup ? "Nombre duplicado" : null;
      renderAll();
    }

    function saveNewCategory() {
      const clean = state.newCategoryName.trim();
      if (!clean) {
        state.categoryError = "El nombre no puede estar vacío";
        renderAll();
        return;
      }
      if (state.categories.some(c => c.name.toLowerCase() === clean.toLowerCase())) {
        state.categoryError = "Nombre duplicado";
        renderAll();
        return;
      }
      state.categories.push({ id: "cat-" + Date.now(), name: clean, color: "#10b981", count: 0 });
      state.creatingCategoryMode = false;
      state.categoryError = null;
      saveState();
      renderAll();
    }

    function openReviewDetail(revId) {
      state.selectedReviewId = revId;
      state.showReviewDetail = true;
      renderAll();
    }

    function publishNewReview() {
      const clean = state.newReviewText.trim();
      if (!clean) {
        state.newReviewError = "El texto no puede estar vacío";
        renderAll();
        return;
      }
      state.reviews.unshift({
        id: "rev-" + Date.now(),
        gameId: state.selectedGameId || "ce",
        author: state.currentUser ? state.currentUser.username : "mauro.b",
        rating: 4.9,
        text: clean
      });
      state.newReviewText = "";
      state.showNewReviewModal = false;
      saveState();
      renderAll();
    }

    function submitReviewComment() {
      if (!state.currentUser) {
        state.pendingAction = "Comentar en reseña";
        state.authGateVisible = true;
        renderAll();
        return;
      }
      const clean = state.newCommentText.trim();
      if (!clean) {
        state.newCommentError = "Escribe un comentario válido";
        renderAll();
        return;
      }
      state.comments.push({
        id: "com-" + Date.now(),
        reviewId: state.selectedReviewId,
        author: state.currentUser.username,
        text: clean
      });
      state.newCommentText = "";
      saveState();
      renderAll();
    }

    function getSwiftFileForScene(sc) {
      const map = {
        1: "RootContentView.swift / AuthViews.swift",
        2: "RootContentView.swift / HomeView.swift",
        3: "CatalogView.swift / IGDBService.swift",
        4: "GameDetailView.swift",
        5: "AppStateStore.swift / AuthViews.swift",
        6: "DiaryView.swift",
        7: "DiaryView.swift (CategoriesManagementSheet)",
        8: "ReviewsView.swift",
        9: "ProfileViews.swift (PublicProfileView)",
        10: "ProfileViews.swift (EditProfileSheet)",
        11: "ProfileViews.swift / AppStateStore.swift",
        12: "UIComponents.swift (RecoverableErrorCardView)",
        13: "GameRevApp.swift"
      };
      return map[sc] || "RootContentView.swift";
    }

    function getSwiftSnippetForScene(sc) {
      const snippets = {
        1: `// Escena 1 · Arranque\nif store.isCheckingSession {\n  SplashSessionCheckView()\n} else if store.shouldShowWelcomeGate {\n  WelcomeGateView()\n} else {\n  adaptiveNavigationShell\n}`,
        2: `// Escena 2 · Navegación Adaptativa\nif horizontalSizeClass == .regular {\n  NavigationSplitView { sidebar } detail: { content }\n} else {\n  TabView(selection: $store.selectedTab) { ... }\n}`,
        3: `// Escena 3 · Consulta a IGDB\nlet results = try await IGDBService.shared.searchCatalog(\n  query: searchQuery,\n  genre: selectedGenreFilter\n)`,
        4: `// Escena 4 · Ficha del videojuego\nButton("Guardar en mi diario") {\n  store.requireAuthenticationOrPerform(.saveToDiary(game))\n}`,
        5: `// Escena 5 · Acción protegida y recuperación\nfunc requireAuthenticationOrPerform(_ action: PendingAction) {\n  if isAuthenticated { executeActionImmediately(action) }\n  else { pendingAction = action; showProtectedAuthSheet = true }\n}`,
        6: `// Escena 6 · Filtrado del diario\nvar filteredCurrentUserDiaryEntries: [DiaryEntry] {\n  userDiaryEntries().filter { matchesStatus && matchesCategory }\n}`,
        7: `// Escena 7 · Validación de categoría única\nif isDuplicate {\n  return "Nombre duplicado"\n}`,
        8: `// Escena 8 · Mini-reseñas y comentarios\nguard !trimmed.isEmpty else {\n  return "El texto de la mini-reseña no puede estar vacío."\n}`,
        9: `// Escena 9 · Perfil público de creador\nif !profile.contactURL.isEmpty {\n  Button("Visitar sitio de contacto") { openURL(url) }\n}`,
        10: `// Escena 10 · Edición condicional\nif profileType == .creator {\n  CreatorFieldsSection(studio: $studio, role: $creatorRole)\n}`,
        11: `// Escena 11 · Control de permisos\nfunc canEditProfile(_ profile: UserProfile) -> Bool {\n  currentUser?.id == profile.ownerId\n}`
      };
      return snippets[sc] || snippets[1];
    }

    // Inicializar aplicación
    renderAll();
  </script>
</body>
</html>
